name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build migrations
        run: npm run build:migrations

      - name: Run tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier
        run: npm run format
